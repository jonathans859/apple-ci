name: Distribute to external testers (reusable)

# Promote, don't rebuild. The signing job already uploaded this exact binary for
# internal testers; this adds it to the external group(s) by version + build
# number. No Xcode, no archive files, so it runs on ubuntu (1x) instead of
# idling a macOS runner (10x) through App Store Connect's processing wait --
# which for macOS builds has been observed to take over an hour.

on:
  workflow_call:
    inputs:
      app-id:
        description: 'App Store Connect numeric app id'
        required: true
        type: string
      marketing:
        description: 'Marketing version of the already-uploaded build'
        required: true
        type: string
      build:
        description: 'CFBundleVersion of the already-uploaded build'
        required: true
        type: string
      platforms:
        description: 'Space-separated: IOS, MAC_OS. Both for a universal-purchase record.'
        default: 'IOS'
        type: string
      groups:
        description: 'Comma-separated external group names, exactly as named in App Store Connect'
        default: 'External'
        type: string
      attempts:
        description: 'Retries while the build is still processing'
        default: 30
        type: number
      asc-version:
        default: '4.10.0'
        type: string

jobs:
  distribute:
    name: External testers
    runs-on: ubuntu-latest
    # The retry loop below already bounds the wait; this is the backstop that
    # stops a wedged process running to GitHub's 6 h ceiling.
    timeout-minutes: 105
    steps:
      - name: Install asc
        env:
          V: ${{ inputs.asc-version }}
        run: |
          set -euo pipefail
          case "$(uname -m)" in aarch64|arm64) ARCH=arm64 ;; *) ARCH=amd64 ;; esac
          BIN="asc_${V}_linux_${ARCH}"
          BASE="https://github.com/rorkai/App-Store-Connect-CLI/releases/download/${V}"
          curl -fsSL -o /tmp/asc "$BASE/$BIN"
          curl -fsSL -o /tmp/asc_checksums.txt "$BASE/asc_${V}_checksums.txt"
          EXPECTED=$(grep " ${BIN}\$" /tmp/asc_checksums.txt | awk '{print $1}')
          ACTUAL=$(sha256sum /tmp/asc | awk '{print $1}')
          if [ -z "$EXPECTED" ] || [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::asc checksum mismatch for $BIN"
            exit 1
          fi
          chmod +x /tmp/asc && sudo mv /tmp/asc /usr/local/bin/asc
          asc --version

      - name: Authenticate asc
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/AuthKey.p8"
          if printf '%s' "$ASC_KEY_P8" | base64 --decode 2>/dev/null | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s' "$ASC_KEY_P8" | base64 --decode > "$KEY"
          else
            printf '%s' "$ASC_KEY_P8" > "$KEY"
          fi
          grep -q "BEGIN PRIVATE KEY" "$KEY" || { echo "::error::ASC_KEY_P8 is not a valid .p8 key."; exit 1; }
          asc auth login --bypass-keychain --name ci \
            --key-id "$ASC_KEY_ID" --issuer-id "$ASC_ISSUER_ID" --private-key "$KEY"

      - name: Add the build to the external group(s)
        env:
          APP: ${{ inputs.app-id }}
          MARKETING: ${{ inputs.marketing }}
          BUILD: ${{ inputs.build }}
          PLATFORMS: ${{ inputs.platforms }}
          GROUPS: ${{ inputs.groups }}
          ATTEMPTS: ${{ inputs.attempts }}
        run: |
          set -uo pipefail
          # --platform is what disambiguates the two platforms of a shared
          # (universal purchase) app record. --submit --confirm puts the build
          # into Beta App Review, which is per marketing VERSION, not per build:
          # the first build of a new version waits, later builds of the same
          # version usually go straight out.
          distribute () {
            asc builds add-groups \
              --app "$APP" \
              --version "$MARKETING" \
              --build-number "$BUILD" \
              --platform "$1" \
              --group "$GROUPS" \
              --submit --confirm
          }
          for platform in $PLATFORMS; do
            n=0
            until distribute "$platform"; do
              n=$((n + 1))
              if [ "$n" -ge "$ATTEMPTS" ]; then
                echo "::error::External distribution for $platform failed after $n attempts (~$((n * 3)) min). The build may still be processing; re-run this job."
                exit 1
              fi
              echo "Build not ready for $platform (attempt $n) — waiting 180s for App Store Connect processing"
              sleep 180
            done
            echo "$platform distributed to $GROUPS"
          done
